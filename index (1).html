<!DOCTYPE html>
<!--
  MOD LIBRARY — GitHub Pages mod browser
  =======================================
  HOW IT WORKS
  This page has no backend. On load, it calls the public GitHub API to list
  folders in your repo, then treats any folder that contains a
  "description.txt" as a mod. "cover.png" is the card thumbnail; any other
  image files (png/jpg/jpeg/gif/webp) become a clickable gallery in the
  mod's popup. Everything else in the mod's root folder gets bundled
  client-side into a .zip when the download button is clicked.

  REPO LAYOUT IT EXPECTS (recommended — resources kept separate)
    your-repo/
      index.html          <- this file
      Some Cool Mod/
        resources/          <- name set by CONFIG.resourcesFolder
          description.txt   <- required (see format below)
          cover.png          <- optional, main thumbnail on the card + modal
          screenshot1.png    <- optional, extra images become a gallery
        mod.zip / files…   <- everything in the mod's root gets zipped for
                              download — keep only real mod files here
      Another Mod/
        resources/
          description.txt
          ...
        ...

  LEGACY LAYOUT (still supported — resources mixed in with files)
    If a mod folder has no "resources" subfolder, the page falls back to
    reading description.txt/cover.png/images straight out of the mod's
    root folder, and treats every other file there as downloadable — same
    behavior as before this option existed.

    Some Cool Mod/
      description.txt
      cover.png
      mod.zip / files…

  description.txt FORMAT
    Line 1              -> the mod's title
    (optional) tags: Weapons, QoL, Multiplayer   <- comma-separated, "category:" also works
    (optional) by: Your Name                     <- "creator:" or "author:" also work
    (blank line)
    everything after    -> the description (line breaks are preserved)

    The tags and "by" lines are both optional and can appear in either
    order. Mods without them just won't show a creator credit or filter
    chip — search and the rest of the page still work fine.

    Example:
      Grappling Hook Overhaul
      tags: Movement, QoL
      by: Mikey

      Adds a fully physics-based grappling hook with rope swing,
      wall-climb assist, and a rebindable launch key.

  SETUP
    1. Edit the CONFIG block below with your GitHub username, repo name,
       and branch.
    2. If your mods live inside a subfolder (e.g. "mods/") instead of the
       repo root, set modsPath accordingly.
    3. Rename resourcesFolder if you'd rather call it something other than
       "resources" (e.g. "meta", "info"). Leave it as-is if you're using
       the legacy flat layout for some or all mods — both work at once.
    4. Commit + push. GitHub Pages will serve this directly.

  NOTE ON RATE LIMITS
    Unauthenticated GitHub API calls are capped at 60/hour per visitor IP.
    This page caches results in sessionStorage per visit to avoid burning
    that budget on repeat loads/clicks. Do NOT put a personal access token
    in this file — it's public, and anyone viewing source would get it.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mod Library</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root{
    --bg: #0f1216;
    --panel: #171b21;
    --panel-2: #20252d;
    --line: #2a303a;
    --text: #e7e5df;
    --muted: #808a97;
    --accent: #ffb000;
    --accent-dim: #b8823a;
    --accent-2: #4fd6be;
    --danger: #ff6b5e;
  }

  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    background-image:
      radial-gradient(ellipse at top, rgba(255,176,0,0.05), transparent 55%);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    min-height: 100vh;
  }

  /* ---------- header ---------- */
  header{
    padding: 56px 24px 32px;
    text-align: center;
  }
  .eyebrow{
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.35em;
    color: var(--accent-2);
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  h1{
    font-family: 'Space Mono', monospace;
    font-weight: 700;
    font-size: clamp(28px, 5vw, 44px);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin: 0;
  }
  h1 .cursor{
    display:inline-block;
    color: var(--accent);
    animation: blink 1.1s steps(2, start) infinite;
  }
  @keyframes blink{ to { opacity: 0; } }
  .subtitle{
    color: var(--muted);
    font-size: 14px;
    margin-top: 10px;
  }

  /* ---------- toolbar ---------- */
  .toolbar{
    max-width: 1180px;
    margin: 0 auto;
    padding: 0 24px 28px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .toolbar.hidden{ display: none; }

  #search-input{
    width: 100%;
    max-width: 360px;
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    font-size: 14px;
    padding: 11px 14px;
    border-radius: 8px;
    outline: none;
    transition: border-color 180ms ease;
  }
  #search-input::placeholder{ color: var(--muted); }
  #search-input:focus{ border-color: var(--accent-dim); }

  .chip-row{
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .chip{
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.03em;
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--muted);
    padding: 7px 13px;
    border-radius: 999px;
    cursor: pointer;
    transition: border-color 160ms ease, color 160ms ease, background 160ms ease;
  }
  .chip:hover{ color: var(--text); border-color: var(--accent-dim); }
  .chip.active{
    background: rgba(255,176,0,0.12);
    border-color: var(--accent);
    color: var(--accent);
  }

  .tag-pills{
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    justify-content: center;
  }
  .tag-pill{
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--accent-2);
    background: rgba(79,214,190,0.1);
    border: 1px solid rgba(79,214,190,0.25);
    padding: 2px 8px;
    border-radius: 999px;
  }
  .card .tag-pills{ margin-top: 8px; }
  .modal-body .tag-pills{ justify-content: flex-start; }

  /* ---------- grid ---------- */
  main{
    max-width: 1180px;
    margin: 0 auto;
    padding: 8px 24px 100px;
  }
  .grid{
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 30px 24px;
  }

  .card{
    background: transparent;
    border: none;
    cursor: pointer;
    text-align: left;
    color: inherit;
    font: inherit;
    padding: 0;
    outline-offset: 4px;
  }
  .card:focus-visible{ outline: 2px solid var(--accent); border-radius: 6px; }

  .cover-wrap{
    position: relative;
    aspect-ratio: 3 / 4;
    border-radius: 10px;
    overflow: hidden;
    background: var(--panel);
    border: 1px solid var(--line);
    transform: translateY(0) scale(1);
    transition: transform 320ms cubic-bezier(0.22, 1, 0.36, 1),
                box-shadow 320ms cubic-bezier(0.22, 1, 0.36, 1),
                border-color 320ms ease;
  }
  .card:hover .cover-wrap,
  .card:focus-visible .cover-wrap{
    transform: translateY(-6px) scale(1.06);
    box-shadow: 0 18px 34px rgba(0,0,0,0.45), 0 0 0 1px rgba(255,176,0,0.25);
    border-color: var(--accent-dim);
  }
  .cover-wrap img{
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }
  .cover-placeholder{
    width: 100%; height: 100%;
    display:flex; align-items:center; justify-content:center;
    font-family: 'Space Mono', monospace;
    font-size: 42px;
    color: var(--panel-2);
    background:
      repeating-linear-gradient(135deg, var(--panel) 0 14px, var(--panel-2) 14px 28px);
  }
  /* cartridge connector strip */
  .cover-wrap::after{
    content: "";
    position: absolute;
    left: 10%; right: 10%; bottom: 0;
    height: 6px;
    background-image: repeating-linear-gradient(
      90deg, var(--accent) 0 4px, transparent 4px 10px
    );
    opacity: 0;
    transition: opacity 320ms ease;
  }
  .card:hover .cover-wrap::after,
  .card:focus-visible .cover-wrap::after{ opacity: 0.55; }

  .card-title{
    margin-top: 12px;
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    text-align: center;
    color: var(--text);
  }
  .card-creator{
    margin-top: 4px;
    font-size: 12px;
    color: var(--muted);
    text-align: center;
  }

  /* ---------- states (loading / empty / error) ---------- */
  .state{
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
    font-family: 'Space Mono', monospace;
    font-size: 13px;
  }
  .state.hidden{ display: none; }
  .state .big{
    display:block;
    font-size: 15px;
    color: var(--text);
    margin-bottom: 8px;
  }
  .state.error .big{ color: var(--danger); }

  .skeleton{
    aspect-ratio: 3/4;
    border-radius: 10px;
    background: linear-gradient(100deg, var(--panel) 30%, var(--panel-2) 50%, var(--panel) 70%);
    background-size: 200% 100%;
    animation: shimmer 1.4s ease-in-out infinite;
  }
  @keyframes shimmer{
    0%{ background-position: 200% 0; }
    100%{ background-position: -200% 0; }
  }

  /* ---------- modal ---------- */
  .overlay{
    position: fixed; inset: 0;
    background: rgba(6,7,9,0.78);
    backdrop-filter: blur(3px);
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
    z-index: 50;
    opacity: 0;
    pointer-events: none;
    transition: opacity 220ms ease;
  }
  .overlay.open{ opacity: 1; pointer-events: auto; }

  .modal{
    width: 100%;
    max-width: 720px;
    max-height: 86vh;
    overflow-y: auto;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    display: grid;
    grid-template-columns: 220px 1fr;
    position: relative;
    transform: scale(0.94) translateY(8px);
    transition: transform 260ms cubic-bezier(0.22, 1, 0.36, 1);
    box-shadow: 0 30px 80px rgba(0,0,0,0.55);
  }
  .overlay.open .modal{ transform: scale(1) translateY(0); }

  @media (max-width: 560px){
    .modal{ grid-template-columns: 1fr; max-height: 90vh; }
  }

  .modal-cover{
    background: var(--panel-2);
    min-height: 200px;
    display: flex;
    flex-direction: column;
  }
  .modal-cover img.modal-main-img{
    width: 100%;
    flex: 1;
    min-height: 0;
    object-fit: cover;
    display: block;
  }
  .modal-cover .cover-placeholder{ flex: 1; font-size: 56px; }

  .gallery-strip{
    display: flex;
    gap: 6px;
    padding: 8px;
    overflow-x: auto;
    background: var(--panel);
    border-top: 1px solid var(--line);
  }
  .gallery-thumb{
    flex: 0 0 auto;
    width: 40px;
    height: 40px;
    border-radius: 6px;
    overflow: hidden;
    border: 1px solid var(--line);
    padding: 0;
    cursor: pointer;
    background: none;
    opacity: 0.55;
    transition: opacity 150ms ease, border-color 150ms ease;
  }
  .gallery-thumb img{ width: 100%; height: 100%; object-fit: cover; display: block; }
  .gallery-thumb:hover{ opacity: 0.85; }
  .gallery-thumb.active{ opacity: 1; border-color: var(--accent); }

  .modal-body{
    padding: 28px 26px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .modal-eyebrow{
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.25em;
    color: var(--accent-2);
    text-transform: uppercase;
  }
  .modal-title{
    font-family: 'Space Mono', monospace;
    font-size: 22px;
    letter-spacing: 0.02em;
    margin: 0;
  }
  .modal-creator{
    font-size: 13px;
    color: var(--muted);
    margin-top: -8px;
  }
  .modal-creator.hidden{ display: none; }
  .modal-body .tag-pills.hidden{ display: none; }
  .modal-desc{
    color: var(--muted);
    font-size: 14px;
    line-height: 1.65;
    white-space: pre-wrap;
    flex: 1;
  }
  .modal-actions{
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: auto;
  }
  .btn-download{
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    background: var(--accent);
    color: #16130a;
    border: none;
    padding: 12px 20px;
    border-radius: 8px;
    cursor: pointer;
    transition: transform 150ms ease, opacity 150ms ease;
  }
  .btn-download:hover:not(:disabled){ transform: translateY(-1px); }
  .btn-download:disabled{ opacity: 0.6; cursor: default; }
  .modal-status{
    font-size: 12px;
    color: var(--muted);
    font-family: 'Space Mono', monospace;
  }

  .modal-close{
    position: absolute;
    top: 14px; right: 14px;
    width: 32px; height: 32px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: var(--panel-2);
    color: var(--text);
    font-size: 16px;
    cursor: pointer;
    line-height: 1;
    display: flex; align-items: center; justify-content: center;
  }
  .modal-close:hover{ border-color: var(--accent-dim); color: var(--accent); }
</style>
</head>
<body>

<header>
  <div class="eyebrow">Accidental Destruction Mods Page</div>
  <h1>A:\Accidental Mods<span class="cursor">_</span></h1>
  <p class="subtitle">select a mod to view details and download</p>
</header>

<div class="toolbar hidden" id="toolbar">
  <input type="search" id="search-input" placeholder="A:\*.*" autocomplete="off">
  <div class="chip-row" id="chip-row"></div>
</div>

<main>
  <div id="grid" class="grid"></div>
  <div id="nomatch-state" class="state hidden">
    <span class="big">No mods match</span>
    try a different search or tag
  </div>
  <div id="loading-state" class="state">
    <div class="grid" id="skeleton-grid"></div>
  </div>
  <div id="empty-state" class="state hidden">
    <span class="big">No mods found</span>
    add a folder to this repo containing a description.txt to list one here
  </div>
  <div id="error-state" class="state error hidden">
    <span class="big" id="error-headline">Couldn't load mods</span>
    <span id="error-detail"></span>
  </div>
</main>

<div class="overlay" id="overlay">
  <div class="modal" role="dialog" aria-modal="true">
    <button class="modal-close" id="modal-close" aria-label="Close">×</button>
    <div class="modal-cover" id="modal-cover-wrap"></div>
    <div class="modal-body">
      <div class="modal-eyebrow" id="modal-folder"></div>
      <h2 class="modal-title" id="modal-title"></h2>
      <div class="modal-creator hidden" id="modal-creator"></div>
      <div class="tag-pills hidden" id="modal-tags"></div>
      <p class="modal-desc" id="modal-desc"></p>
      <div class="modal-actions">
        <button class="btn-download" id="modal-download">Download files</button>
        <span class="modal-status" id="modal-status"></span>
      </div>
    </div>
  </div>
</div>

<script>
  // ============ CONFIG — edit this ============
  const CONFIG = {
    owner: "ByteGames10101010",      // e.g. "mikey"
    repo: "AccidentalMods.github.io", // e.g. "my-game-mods"
    branch: "main",                  // branch mods are read from
    modsPath: "",                    // "" = repo root, or e.g. "mods"
    resourcesFolder: "resources"     // subfolder name for description.txt/cover/gallery — see header comment
  };
  // =============================================

  const gridEl = document.getElementById('grid');
  const loadingEl = document.getElementById('loading-state');
  const emptyEl = document.getElementById('empty-state');
  const errorEl = document.getElementById('error-state');
  const nomatchEl = document.getElementById('nomatch-state');
  const skeletonGrid = document.getElementById('skeleton-grid');
  const toolbarEl = document.getElementById('toolbar');
  const searchInput = document.getElementById('search-input');
  const chipRow = document.getElementById('chip-row');

  const overlay = document.getElementById('overlay');
  const modalCoverWrap = document.getElementById('modal-cover-wrap');
  const modalTitle = document.getElementById('modal-title');
  const modalFolder = document.getElementById('modal-folder');
  const modalCreator = document.getElementById('modal-creator');
  const modalTags = document.getElementById('modal-tags');
  const modalDesc = document.getElementById('modal-desc');
  const modalDownload = document.getElementById('modal-download');
  const modalStatus = document.getElementById('modal-status');
  const modalClose = document.getElementById('modal-close');

  let mods = [];
  let activeMod = null;
  let searchQuery = '';
  let selectedTag = 'all';

  function apiUrl(path){
    const base = `https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents`;
    const full = path ? `${base}/${path}` : base;
    return CONFIG.branch ? `${full}?ref=${encodeURIComponent(CONFIG.branch)}` : full;
  }

  async function ghGet(url){
    const cacheKey = 'modlib:' + url;
    const cached = sessionStorage.getItem(cacheKey);
    if (cached) return JSON.parse(cached);

    const res = await fetch(url, { headers: { Accept: 'application/vnd.github+json' } });
    if (!res.ok){
      if (res.status === 403) throw new Error('RATE_LIMIT');
      if (res.status === 404) throw new Error('NOT_FOUND');
      throw new Error('HTTP_' + res.status);
    }
    const data = await res.json();
    try { sessionStorage.setItem(cacheKey, JSON.stringify(data)); } catch (e) { /* storage full, ignore */ }
    return data;
  }

  function parseDescriptionFile(text){
    const lines = text.replace(/\r\n/g, '\n').split('\n');
    let i = 0;
    while (i < lines.length && lines[i].trim() === '') i++;
    const title = (lines[i] || 'Untitled Mod').trim();
    i++;

    let tags = [];
    let creator = '';
    let scanning = true;
    while (scanning){
      let j = i;
      while (j < lines.length && lines[j].trim() === '') j++;
      if (j >= lines.length){ i = j; break; }

      const line = lines[j];
      const tagMatch = line.match(/^(tags?|categor(?:y|ies)):\s*(.*)$/i);
      const creatorMatch = line.match(/^(by|creators?|authors?):\s*(.*)$/i);

      if (tagMatch && !tags.length){
        tags = tagMatch[2].split(',').map(t => t.trim()).filter(Boolean);
        i = j + 1;
      } else if (creatorMatch && !creator){
        creator = creatorMatch[2].trim();
        i = j + 1;
      } else {
        scanning = false;
        i = j;
      }
    }

    while (i < lines.length && lines[i].trim() === '') i++;
    const description = lines.slice(i).join('\n').trim();
    return { title, tags, creator, description };
  }

  async function buildMod(dirItem){
    let items;
    try {
      items = await ghGet(apiUrl(dirItem.path));
    } catch (e) {
      return null; // unreadable folder, skip it
    }
    if (!Array.isArray(items)) return null;

    // If a resources subfolder exists, description.txt/cover/gallery live
    // there and everything else in the mod's root folder is downloadable.
    // If not, fall back to the old flat layout (resources + files mixed
    // together in the mod's root folder).
    const resourcesDirName = (CONFIG.resourcesFolder || '').trim().toLowerCase();
    const resourcesDir = resourcesDirName
      ? items.find(f => f.type === 'dir' && f.name.toLowerCase() === resourcesDirName)
      : null;

    let resourceItems = items;
    if (resourcesDir){
      try {
        const fetched = await ghGet(apiUrl(resourcesDir.path));
        resourceItems = Array.isArray(fetched) ? fetched : [];
      } catch (e) {
        resourceItems = []; // resources folder unreadable, treat as no resources
      }
    }

    const descFile = resourceItems.find(f => f.type === 'file' && f.name.toLowerCase() === 'description.txt');
    if (!descFile) return null; // not a mod folder

    const imageExt = /\.(png|jpe?g|gif|webp)$/i;
    const explicitCover = resourceItems.find(f => f.type === 'file' && f.name.toLowerCase() === 'cover.png');
    const otherImages = resourceItems
      .filter(f => f.type === 'file' && imageExt.test(f.name) && f !== explicitCover)
      .sort((a, b) => a.name.localeCompare(b.name));

    // If there's no cover.png, fall back to the first other image as the
    // primary thumbnail and keep the rest as the gallery.
    const coverFile = explicitCover || otherImages[0] || null;
    const galleryFiles = explicitCover ? otherImages : otherImages.slice(1);

    // Downloadable files: everything in the mod's root folder, minus the
    // resources subfolder itself. If there's no resources subfolder, fall
    // back to excluding description.txt/images so the legacy flat layout
    // still works.
    const otherFiles = items.filter(f => {
      if (f.type !== 'file') return false;
      if (resourcesDir) return true;
      const lower = f.name.toLowerCase();
      if (lower === 'description.txt') return false;
      if (imageExt.test(f.name)) return false;
      return true;
    });

    const descRes = await fetch(descFile.download_url);
    const descText = await descRes.text();
    const { title, tags, creator, description } = parseDescriptionFile(descText);

    return {
      folder: dirItem.name,
      path: dirItem.path,
      title,
      tags,
      creator,
      description,
      coverUrl: coverFile ? coverFile.download_url : null,
      gallery: galleryFiles.map(f => ({ name: f.name, url: f.download_url })),
      files: otherFiles.map(f => ({ name: f.name, url: f.download_url }))
    };
  }

  function tagPillsMarkup(tags){
    if (!tags || !tags.length) return null;
    const row = document.createElement('div');
    row.className = 'tag-pills';
    tags.forEach(t => {
      const pill = document.createElement('span');
      pill.className = 'tag-pill';
      pill.textContent = t;
      row.appendChild(pill);
    });
    return row;
  }

  function coverMarkup(url, title, big){
    if (url){
      const img = document.createElement('img');
      img.src = url;
      img.alt = title;
      img.loading = 'lazy';
      return img;
    }
    const div = document.createElement('div');
    div.className = 'cover-placeholder';
    div.textContent = (title || '?').trim().charAt(0).toUpperCase() || '?';
    return div;
  }

  function renderGrid(list){
    gridEl.innerHTML = '';
    list.forEach((mod) => {
      const card = document.createElement('button');
      card.className = 'card';
      card.type = 'button';
      card.addEventListener('click', () => openModal(mod));

      const coverWrap = document.createElement('div');
      coverWrap.className = 'cover-wrap';
      coverWrap.appendChild(coverMarkup(mod.coverUrl, mod.title));

      const titleEl = document.createElement('div');
      titleEl.className = 'card-title';
      titleEl.textContent = mod.title;

      card.appendChild(coverWrap);
      card.appendChild(titleEl);

      if (mod.creator){
        const creatorEl = document.createElement('div');
        creatorEl.className = 'card-creator';
        creatorEl.textContent = `by ${mod.creator}`;
        card.appendChild(creatorEl);
      }

      const pills = tagPillsMarkup(mod.tags);
      if (pills) card.appendChild(pills);
      gridEl.appendChild(card);
    });
  }

  // Builds the row of clickable thumbnails under the modal's main image.
  // Only rendered when a mod has more than one image (cover + gallery).
  function buildGalleryStrip(mod){
    const allImages = [];
    if (mod.coverUrl) allImages.push(mod.coverUrl);
    (mod.gallery || []).forEach(g => allImages.push(g.url));
    if (allImages.length < 2) return null;

    const strip = document.createElement('div');
    strip.className = 'gallery-strip';
    allImages.forEach((url, idx) => {
      const thumb = document.createElement('button');
      thumb.type = 'button';
      thumb.className = 'gallery-thumb' + (idx === 0 ? ' active' : '');
      const img = document.createElement('img');
      img.src = url;
      img.alt = mod.title;
      thumb.appendChild(img);
      thumb.addEventListener('click', () => {
        const mainImg = modalCoverWrap.querySelector('img.modal-main-img');
        if (mainImg) mainImg.src = url;
        strip.querySelectorAll('.gallery-thumb').forEach(t => t.classList.remove('active'));
        thumb.classList.add('active');
      });
      strip.appendChild(thumb);
    });
    return strip;
  }

  function fillTagPills(container, tags){
    container.innerHTML = '';
    if (!tags || !tags.length){
      container.classList.add('hidden');
      return;
    }
    container.classList.remove('hidden');
    tags.forEach(t => {
      const pill = document.createElement('span');
      pill.className = 'tag-pill';
      pill.textContent = t;
      container.appendChild(pill);
    });
  }

  function openModal(mod){
    activeMod = mod;

    modalCoverWrap.innerHTML = '';
    const mainCover = coverMarkup(activeMod.coverUrl, activeMod.title, true);
    if (mainCover.tagName === 'IMG') mainCover.classList.add('modal-main-img');
    modalCoverWrap.appendChild(mainCover);
    const strip = buildGalleryStrip(activeMod);
    if (strip) modalCoverWrap.appendChild(strip);

    modalFolder.textContent = activeMod.folder;
    modalTitle.textContent = activeMod.title;

    if (activeMod.creator){
      modalCreator.textContent = `by ${activeMod.creator}`;
      modalCreator.classList.remove('hidden');
    } else {
      modalCreator.classList.add('hidden');
    }

    fillTagPills(modalTags, activeMod.tags);

    modalDesc.textContent = activeMod.description || 'No description provided.';
    modalStatus.textContent = activeMod.files.length
      ? `${activeMod.files.length} file${activeMod.files.length === 1 ? '' : 's'} in download`
      : 'No extra files in this folder';
    modalDownload.disabled = activeMod.files.length === 0;
    modalDownload.textContent = 'Download files';

    overlay.classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeModal(){
    overlay.classList.remove('open');
    document.body.style.overflow = '';
    activeMod = null;
  }

  modalClose.addEventListener('click', closeModal);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

  modalDownload.addEventListener('click', async () => {
    if (!activeMod || !activeMod.files.length) return;
    const btn = modalDownload;
    btn.disabled = true;
    btn.textContent = 'Packing…';
    modalStatus.textContent = '';
    try {
      const zip = new JSZip();
      await Promise.all(activeMod.files.map(async (f) => {
        const res = await fetch(f.url);
        if (!res.ok) throw new Error('Could not fetch ' + f.name);
        const blob = await res.blob();
        zip.file(f.name, blob);
      }));
      const content = await zip.generateAsync({ type: 'blob' });
      const url = URL.createObjectURL(content);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${activeMod.folder}.zip`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      btn.textContent = 'Downloaded ✓';
    } catch (err) {
      console.error(err);
      btn.textContent = 'Failed — retry';
    } finally {
      setTimeout(() => {
        btn.disabled = false;
        btn.textContent = 'Download files';
      }, 2200);
    }
  });

  function collectTags(){
    const set = new Set();
    mods.forEach(m => m.tags.forEach(t => set.add(t)));
    return Array.from(set).sort((a, b) => a.localeCompare(b));
  }

  function renderChips(){
    const allTags = collectTags();
    chipRow.innerHTML = '';
    if (!allTags.length){
      chipRow.style.display = 'none';
      return;
    }
    chipRow.style.display = 'flex';

    const makeChip = (label, value) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'chip' + (selectedTag === value ? ' active' : '');
      b.textContent = label;
      b.addEventListener('click', () => {
        selectedTag = value;
        renderChips();
        applyFilters();
      });
      return b;
    };

    chipRow.appendChild(makeChip('All', 'all'));
    allTags.forEach(t => chipRow.appendChild(makeChip(t, t)));
  }

  function applyFilters(){
    const q = searchQuery.trim().toLowerCase();
    const filtered = mods.filter(m => {
      const matchesTag = selectedTag === 'all' || m.tags.includes(selectedTag);
      const matchesQuery = !q
        || m.title.toLowerCase().includes(q)
        || m.description.toLowerCase().includes(q)
        || m.tags.some(t => t.toLowerCase().includes(q));
      return matchesTag && matchesQuery;
    });

    renderGrid(filtered);
    nomatchEl.classList.toggle('hidden', filtered.length !== 0);
    gridEl.classList.toggle('hidden', filtered.length === 0);
  }

  searchInput.addEventListener('input', (e) => {
    searchQuery = e.target.value;
    applyFilters();
  });

  function showSkeleton(){
    skeletonGrid.innerHTML = '';
    for (let i = 0; i < 6; i++){
      const s = document.createElement('div');
      s.className = 'skeleton';
      skeletonGrid.appendChild(s);
    }
  }

  function showState(state){
    loadingEl.classList.toggle('hidden', state !== 'loading');
    emptyEl.classList.toggle('hidden', state !== 'empty');
    errorEl.classList.toggle('hidden', state !== 'error');
    toolbarEl.classList.toggle('hidden', state !== 'ready');
    if (state !== 'ready'){
      gridEl.classList.add('hidden');
      nomatchEl.classList.add('hidden');
    }
  }

  async function init(){
    showSkeleton();
    showState('loading');
    try {
      const rootPath = CONFIG.modsPath.replace(/^\/|\/$/g, '');
      const rootItems = await ghGet(apiUrl(rootPath));
      const dirs = rootItems.filter(it => it.type === 'dir');

      const built = await Promise.all(dirs.map(buildMod));
      mods = built.filter(Boolean).sort((a, b) => a.title.localeCompare(b.title));

      if (!mods.length){
        showState('empty');
        return;
      }
      showState('ready');
      renderChips();
      applyFilters();
    } catch (err) {
      console.error(err);
      const headline = document.getElementById('error-headline');
      const detail = document.getElementById('error-detail');
      if (err.message === 'RATE_LIMIT'){
        headline.textContent = 'GitHub API rate limit reached';
        detail.textContent = 'Unauthenticated requests are capped at 60/hour per visitor. Wait a bit and refresh.';
      } else if (err.message === 'NOT_FOUND'){
        headline.textContent = 'Repo or path not found';
        detail.textContent = 'Check owner/repo/branch/modsPath in the CONFIG block at the top of index.html.';
      } else {
        headline.textContent = "Couldn't load mods";
        detail.textContent = 'Check your internet connection, or the CONFIG values in index.html.';
      }
      showState('error');
    }
  }

  init();
</script>
</body>
</html>
