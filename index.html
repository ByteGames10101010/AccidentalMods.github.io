<!DOCTYPE html>
<!--
  MOD LIBRARY — GitHub Pages mod browser
  =======================================
  HOW IT WORKS
  This page has no backend. On load, it calls the public GitHub API to list
  folders in your repo, then treats any folder that contains a
  "description.txt" as a mod. Everything else in that folder (except
  description.txt and cover.png) gets zipped client-side on download.

  REPO LAYOUT IT EXPECTS
    your-repo/
      index.html          <- this file
      Some Cool Mod/
        description.txt   <- required (see format below)
        cover.png          <- optional, shown on the card + modal
        mod.zip / files…   <- anything else, gets bundled into a .zip
      Another Mod/
        description.txt
        ...

  description.txt FORMAT
    Line 1            -> the mod's title
    (blank line)
    everything after  -> the description (line breaks are preserved)

    Example:
      Grappling Hook Overhaul
      
      Adds a fully physics-based grappling hook with rope swing,
      wall-climb assist, and a rebindable launch key.

  SETUP
    1. Edit the CONFIG block below with your GitHub username, repo name,
       and branch.
    2. If your mods live inside a subfolder (e.g. "mods/") instead of the
       repo root, set modsPath accordingly.
    3. Commit + push. GitHub Pages will serve this directly.

  NOTE ON RATE LIMITS
    Unauthenticated GitHub API calls are capped at 60/hour per visitor IP.
    This page caches results in sessionStorage per visit to avoid burning
    that budget on repeat loads/clicks. Do NOT put a personal access token
    in this file — it's public, and anyone viewing source would get it.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mod Library</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root{
    --bg: #0f1216;
    --panel: #171b21;
    --panel-2: #20252d;
    --line: #2a303a;
    --text: #e7e5df;
    --muted: #808a97;
    --accent: #ffb000;
    --accent-dim: #b8823a;
    --accent-2: #4fd6be;
    --danger: #ff6b5e;
  }

  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    background-image:
      radial-gradient(ellipse at top, rgba(255,176,0,0.05), transparent 55%);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    min-height: 100vh;
  }

  /* ---------- header ---------- */
  header{
    padding: 56px 24px 32px;
    text-align: center;
  }
  .eyebrow{
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.35em;
    color: var(--accent-2);
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  h1{
    font-family: 'Space Mono', monospace;
    font-weight: 700;
    font-size: clamp(28px, 5vw, 44px);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin: 0;
  }
  h1 .cursor{
    display:inline-block;
    color: var(--accent);
    animation: blink 1.1s steps(2, start) infinite;
  }
  @keyframes blink{ to { opacity: 0; } }
  .subtitle{
    color: var(--muted);
    font-size: 14px;
    margin-top: 10px;
  }

  /* ---------- grid ---------- */
  main{
    max-width: 1180px;
    margin: 0 auto;
    padding: 8px 24px 100px;
  }
  .grid{
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 30px 24px;
  }

  .card{
    background: transparent;
    border: none;
    cursor: pointer;
    text-align: left;
    color: inherit;
    font: inherit;
    padding: 0;
    outline-offset: 4px;
  }
  .card:focus-visible{ outline: 2px solid var(--accent); border-radius: 6px; }

  .cover-wrap{
    position: relative;
    aspect-ratio: 3 / 4;
    border-radius: 10px;
    overflow: hidden;
    background: var(--panel);
    border: 1px solid var(--line);
    transform: translateY(0) scale(1);
    transition: transform 320ms cubic-bezier(0.22, 1, 0.36, 1),
                box-shadow 320ms cubic-bezier(0.22, 1, 0.36, 1),
                border-color 320ms ease;
  }
  .card:hover .cover-wrap,
  .card:focus-visible .cover-wrap{
    transform: translateY(-6px) scale(1.06);
    box-shadow: 0 18px 34px rgba(0,0,0,0.45), 0 0 0 1px rgba(255,176,0,0.25);
    border-color: var(--accent-dim);
  }
  .cover-wrap img{
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }
  .cover-placeholder{
    width: 100%; height: 100%;
    display:flex; align-items:center; justify-content:center;
    font-family: 'Space Mono', monospace;
    font-size: 42px;
    color: var(--panel-2);
    background:
      repeating-linear-gradient(135deg, var(--panel) 0 14px, var(--panel-2) 14px 28px);
  }
  /* cartridge connector strip */
  .cover-wrap::after{
    content: "";
    position: absolute;
    left: 10%; right: 10%; bottom: 0;
    height: 6px;
    background-image: repeating-linear-gradient(
      90deg, var(--accent) 0 4px, transparent 4px 10px
    );
    opacity: 0;
    transition: opacity 320ms ease;
  }
  .card:hover .cover-wrap::after,
  .card:focus-visible .cover-wrap::after{ opacity: 0.55; }

  .card-title{
    margin-top: 12px;
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    text-align: center;
    color: var(--text);
  }

  /* ---------- states (loading / empty / error) ---------- */
  .state{
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
    font-family: 'Space Mono', monospace;
    font-size: 13px;
  }
  .state.hidden{ display: none; }
  .state .big{
    display:block;
    font-size: 15px;
    color: var(--text);
    margin-bottom: 8px;
  }
  .state.error .big{ color: var(--danger); }

  .skeleton{
    aspect-ratio: 3/4;
    border-radius: 10px;
    background: linear-gradient(100deg, var(--panel) 30%, var(--panel-2) 50%, var(--panel) 70%);
    background-size: 200% 100%;
    animation: shimmer 1.4s ease-in-out infinite;
  }
  @keyframes shimmer{
    0%{ background-position: 200% 0; }
    100%{ background-position: -200% 0; }
  }

  /* ---------- modal ---------- */
  .overlay{
    position: fixed; inset: 0;
    background: rgba(6,7,9,0.78);
    backdrop-filter: blur(3px);
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
    z-index: 50;
    opacity: 0;
    pointer-events: none;
    transition: opacity 220ms ease;
  }
  .overlay.open{ opacity: 1; pointer-events: auto; }

  .modal{
    width: 100%;
    max-width: 720px;
    max-height: 86vh;
    overflow-y: auto;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    display: grid;
    grid-template-columns: 220px 1fr;
    position: relative;
    transform: scale(0.94) translateY(8px);
    transition: transform 260ms cubic-bezier(0.22, 1, 0.36, 1);
    box-shadow: 0 30px 80px rgba(0,0,0,0.55);
  }
  .overlay.open .modal{ transform: scale(1) translateY(0); }

  @media (max-width: 560px){
    .modal{ grid-template-columns: 1fr; max-height: 90vh; }
  }

  .modal-cover{
    background: var(--panel-2);
    min-height: 200px;
  }
  .modal-cover img{ width:100%; height:100%; object-fit: cover; display:block; }
  .modal-cover .cover-placeholder{ font-size: 56px; }

  .modal-body{
    padding: 28px 26px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .modal-eyebrow{
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.25em;
    color: var(--accent-2);
    text-transform: uppercase;
  }
  .modal-title{
    font-family: 'Space Mono', monospace;
    font-size: 22px;
    letter-spacing: 0.02em;
    margin: 0;
  }
  .modal-desc{
    color: var(--muted);
    font-size: 14px;
    line-height: 1.65;
    white-space: pre-wrap;
    flex: 1;
  }
  .modal-actions{
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: auto;
  }
  .btn-download{
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    background: var(--accent);
    color: #16130a;
    border: none;
    padding: 12px 20px;
    border-radius: 8px;
    cursor: pointer;
    transition: transform 150ms ease, opacity 150ms ease;
  }
  .btn-download:hover:not(:disabled){ transform: translateY(-1px); }
  .btn-download:disabled{ opacity: 0.6; cursor: default; }
  .modal-status{
    font-size: 12px;
    color: var(--muted);
    font-family: 'Space Mono', monospace;
  }

  .modal-close{
    position: absolute;
    top: 14px; right: 14px;
    width: 32px; height: 32px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: var(--panel-2);
    color: var(--text);
    font-size: 16px;
    cursor: pointer;
    line-height: 1;
    display: flex; align-items: center; justify-content: center;
  }
  .modal-close:hover{ border-color: var(--accent-dim); color: var(--accent); }
</style>
</head>
<body>

<header>
  <div class="eyebrow">Accidental Destruction Mods Page</div>
  <h1>Accidental Mods<span class="cursor">_</span></h1>
  <p class="subtitle">select a mod to view details and download</p>
</header>

<main>
  <div id="grid" class="grid"></div>
  <div id="loading-state" class="state">
    <div class="grid" id="skeleton-grid"></div>
  </div>
  <div id="empty-state" class="state hidden">
    <span class="big">No mods found</span>
    add a folder to this repo containing a description.txt to list one here
  </div>
  <div id="error-state" class="state error hidden">
    <span class="big" id="error-headline">Couldn't load mods</span>
    <span id="error-detail"></span>
  </div>
</main>

<div class="overlay" id="overlay">
  <div class="modal" role="dialog" aria-modal="true">
    <button class="modal-close" id="modal-close" aria-label="Close">×</button>
    <div class="modal-cover" id="modal-cover-wrap"></div>
    <div class="modal-body">
      <div class="modal-eyebrow" id="modal-folder"></div>
      <h2 class="modal-title" id="modal-title"></h2>
      <p class="modal-desc" id="modal-desc"></p>
      <div class="modal-actions">
        <button class="btn-download" id="modal-download">Download files</button>
        <span class="modal-status" id="modal-status"></span>
      </div>
    </div>
  </div>
</div>

<script>
  // ============ CONFIG — edit this ============
  const CONFIG = {
    owner: "YOUR_GITHUB_USERNAME",   // e.g. "mikey"
    repo: "YOUR_REPO_NAME",          // e.g. "my-game-mods"
    branch: "main",                  // branch mods are read from
    modsPath: ""                     // "" = repo root, or e.g. "mods"
  };
  // =============================================

  const gridEl = document.getElementById('grid');
  const loadingEl = document.getElementById('loading-state');
  const emptyEl = document.getElementById('empty-state');
  const errorEl = document.getElementById('error-state');
  const skeletonGrid = document.getElementById('skeleton-grid');

  const overlay = document.getElementById('overlay');
  const modalCoverWrap = document.getElementById('modal-cover-wrap');
  const modalTitle = document.getElementById('modal-title');
  const modalFolder = document.getElementById('modal-folder');
  const modalDesc = document.getElementById('modal-desc');
  const modalDownload = document.getElementById('modal-download');
  const modalStatus = document.getElementById('modal-status');
  const modalClose = document.getElementById('modal-close');

  let mods = [];
  let activeMod = null;

  function apiUrl(path){
    const base = `https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents`;
    const full = path ? `${base}/${path}` : base;
    return CONFIG.branch ? `${full}?ref=${encodeURIComponent(CONFIG.branch)}` : full;
  }

  async function ghGet(url){
    const cacheKey = 'modlib:' + url;
    const cached = sessionStorage.getItem(cacheKey);
    if (cached) return JSON.parse(cached);

    const res = await fetch(url, { headers: { Accept: 'application/vnd.github+json' } });
    if (!res.ok){
      if (res.status === 403) throw new Error('RATE_LIMIT');
      if (res.status === 404) throw new Error('NOT_FOUND');
      throw new Error('HTTP_' + res.status);
    }
    const data = await res.json();
    try { sessionStorage.setItem(cacheKey, JSON.stringify(data)); } catch (e) { /* storage full, ignore */ }
    return data;
  }

  function parseDescriptionFile(text){
    const lines = text.replace(/\r\n/g, '\n').split('\n');
    let i = 0;
    while (i < lines.length && lines[i].trim() === '') i++;
    const title = (lines[i] || 'Untitled Mod').trim();
    i++;
    while (i < lines.length && lines[i].trim() === '') i++;
    const description = lines.slice(i).join('\n').trim();
    return { title, description };
  }

  async function buildMod(dirItem){
    let items;
    try {
      items = await ghGet(apiUrl(dirItem.path));
    } catch (e) {
      return null; // unreadable folder, skip it
    }
    if (!Array.isArray(items)) return null;

    const descFile = items.find(f => f.type === 'file' && f.name.toLowerCase() === 'description.txt');
    if (!descFile) return null; // not a mod folder

    const coverFile = items.find(f => f.type === 'file' && f.name.toLowerCase() === 'cover.png');
    const otherFiles = items.filter(f =>
      f.type === 'file' && f.name.toLowerCase() !== 'description.txt' && f.name.toLowerCase() !== 'cover.png'
    );

    const descRes = await fetch(descFile.download_url);
    const descText = await descRes.text();
    const { title, description } = parseDescriptionFile(descText);

    return {
      folder: dirItem.name,
      path: dirItem.path,
      title,
      description,
      coverUrl: coverFile ? coverFile.download_url : null,
      files: otherFiles.map(f => ({ name: f.name, url: f.download_url }))
    };
  }

  function coverMarkup(url, title, big){
    if (url){
      const img = document.createElement('img');
      img.src = url;
      img.alt = title;
      img.loading = 'lazy';
      return img;
    }
    const div = document.createElement('div');
    div.className = 'cover-placeholder';
    div.textContent = (title || '?').trim().charAt(0).toUpperCase() || '?';
    return div;
  }

  function renderGrid(){
    gridEl.innerHTML = '';
    mods.forEach((mod, idx) => {
      const card = document.createElement('button');
      card.className = 'card';
      card.type = 'button';
      card.addEventListener('click', () => openModal(idx));

      const coverWrap = document.createElement('div');
      coverWrap.className = 'cover-wrap';
      coverWrap.appendChild(coverMarkup(mod.coverUrl, mod.title));

      const titleEl = document.createElement('div');
      titleEl.className = 'card-title';
      titleEl.textContent = mod.title;

      card.appendChild(coverWrap);
      card.appendChild(titleEl);
      gridEl.appendChild(card);
    });
  }

  function openModal(idx){
    activeMod = mods[idx];
    modalCoverWrap.innerHTML = '';
    modalCoverWrap.appendChild(coverMarkup(activeMod.coverUrl, activeMod.title, true));
    modalFolder.textContent = activeMod.folder;
    modalTitle.textContent = activeMod.title;
    modalDesc.textContent = activeMod.description || 'No description provided.';
    modalStatus.textContent = activeMod.files.length
      ? `${activeMod.files.length} file${activeMod.files.length === 1 ? '' : 's'} in download`
      : 'No extra files in this folder';
    modalDownload.disabled = activeMod.files.length === 0;
    modalDownload.textContent = 'Download files';
    overlay.classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeModal(){
    overlay.classList.remove('open');
    document.body.style.overflow = '';
    activeMod = null;
  }

  modalClose.addEventListener('click', closeModal);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

  modalDownload.addEventListener('click', async () => {
    if (!activeMod || !activeMod.files.length) return;
    const btn = modalDownload;
    btn.disabled = true;
    btn.textContent = 'Packing…';
    modalStatus.textContent = '';
    try {
      const zip = new JSZip();
      await Promise.all(activeMod.files.map(async (f) => {
        const res = await fetch(f.url);
        if (!res.ok) throw new Error('Could not fetch ' + f.name);
        const blob = await res.blob();
        zip.file(f.name, blob);
      }));
      const content = await zip.generateAsync({ type: 'blob' });
      const url = URL.createObjectURL(content);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${activeMod.folder}.zip`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      btn.textContent = 'Downloaded ✓';
    } catch (err) {
      console.error(err);
      btn.textContent = 'Failed — retry';
    } finally {
      setTimeout(() => {
        btn.disabled = false;
        btn.textContent = 'Download files';
      }, 2200);
    }
  });

  function showSkeleton(){
    skeletonGrid.innerHTML = '';
    for (let i = 0; i < 6; i++){
      const s = document.createElement('div');
      s.className = 'skeleton';
      skeletonGrid.appendChild(s);
    }
  }

  function showState(state){
    loadingEl.classList.toggle('hidden', state !== 'loading');
    emptyEl.classList.toggle('hidden', state !== 'empty');
    errorEl.classList.toggle('hidden', state !== 'error');
    gridEl.classList.toggle('hidden', state !== 'ready');
  }

  async function init(){
    showSkeleton();
    showState('loading');
    try {
      const rootPath = CONFIG.modsPath.replace(/^\/|\/$/g, '');
      const rootItems = await ghGet(apiUrl(rootPath));
      const dirs = rootItems.filter(it => it.type === 'dir');

      const built = await Promise.all(dirs.map(buildMod));
      mods = built.filter(Boolean).sort((a, b) => a.title.localeCompare(b.title));

      if (!mods.length){
        showState('empty');
        return;
      }
      renderGrid();
      showState('ready');
    } catch (err) {
      console.error(err);
      const headline = document.getElementById('error-headline');
      const detail = document.getElementById('error-detail');
      if (err.message === 'RATE_LIMIT'){
        headline.textContent = 'GitHub API rate limit reached';
        detail.textContent = 'Unauthenticated requests are capped at 60/hour per visitor. Wait a bit and refresh.';
      } else if (err.message === 'NOT_FOUND'){
        headline.textContent = 'Repo or path not found';
        detail.textContent = 'Check owner/repo/branch/modsPath in the CONFIG block at the top of index.html.';
      } else {
        headline.textContent = "Couldn't load mods";
        detail.textContent = 'Check your internet connection, or the CONFIG values in index.html.';
      }
      showState('error');
    }
  }

  init();
</script>
</body>
</html>
